name: Validate UniProyect
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npx --yes firebase-tools@13.35.1 setup:emulators:firestore
      - run: npm run test:integration
        env:
          FIRESTORE_EMULATOR_JAR: /home/runner/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar
